version: "3.9"

services:
  db:
    image: postgres:16
    container_name: prreviewer-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    container_name: prreviewer-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MIGRATIONS_DIR: /migrations

  app:
    build:
      context: .
      dockerfile: cmd/app/Dockerfile
    container_name: prreviewer-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8080:8080"
